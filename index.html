<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barros - Taekwondo e Fitness</title>

    <!-- Fonte Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>


<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="nav-logo">

            <img
                src="assets/logo.png"
                alt="Academia Barros"
                class="logo-image"
            >

        </div>


        <div class="nav-links">

            <a href="#" class="active">
                INÍCIO
            </a>

            <a href="#">
                PLANOS
            </a>

            <a href="#">
                SOBRE
            </a>

            <a href="#">
                CONTATO
            </a>

        </div>

    </nav>


    <!-- =========================
         CARDS / GALERIA
    ========================== -->

    <section class="cards-section">

        <button
            class="card-arrow left"
            aria-label="Imagem anterior">
            ‹
        </button>


        <div class="cards-container">

            <!-- CARD 1 -->

            <div class="image-card">

                <img
                    src="assets/academia-1.jpg"
                    alt="Academia Barros"
                >

            </div>


            <!-- CARD 2 -->

            <div class="image-card">

                <img
                    src="assets/academia-2.jpg"
                    alt="Academia Barros"
                >

            </div>


            <!-- CARD 3 -->

            <div class="image-card">

                <img
                    src="assets/academia-3.jpg"
                    alt="Academia Barros"
                >

            </div>

        </div>


        <button
            class="card-arrow right"
            aria-label="Próxima imagem">
            ›
        </button>


        <!-- INDICADORES -->

        <div class="carousel-dots">

            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>

        </div>

    </section>


    <!-- =========================
         GIFS
    ========================== -->

    <section class="media-preview">

        <div class="media-card">

            <img
                src="assets/treino.gif"
                alt="Treino de musculação"
            >

        </div>


        <div class="media-card">

            <img
                src="assets/taekwondo.gif"
                alt="Treino de Taekwondo"
            >

        </div>

    </section>


</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barros - Taekwondo e Fitness</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="nav-logo">
            <div class="logo-placeholder">B</div>

            <div class="logo-text">
                <strong>BARROS</strong>
                <span>TAEKWONDO E FITNESS</span>
            </div>
        </div>

        <div class="nav-links">
            <a href="#" class="active">INÍCIO</a>
            <a href="#">PLANOS</a>
            <a href="#">SOBRE</a>
            <a href="#">CONTATO</a>
        </div>

    </nav>


    <!-- CARDS -->
    <section class="cards-section">

        <button class="card-arrow left" aria-label="Anterior">
            ‹
        </button>

        <div class="cards-container">

            <div class="image-card">
                <div class="image-placeholder">
                    IMAGEM 1
                </div>
            </div>

            <div class="image-card">
                <div class="image-placeholder">
                    IMAGEM 2
                </div>
            </div>

            <div class="image-card">
                <div class="image-placeholder">
                    IMAGEM 3
                </div>
            </div>

        </div>

        <button class="card-arrow right" aria-label="Próximo">
            ›
        </button>


        <div class="carousel-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

    </section>

</body>
                </html>
